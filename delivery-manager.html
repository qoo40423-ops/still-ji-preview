<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3546"><title>紀家｜宅配管理 DEMO</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#45342f;background:#faf6ef}*{box-sizing:border-box}body{margin:0}header{background:#783748;color:white;padding:22px max(20px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:5px 0}small{opacity:.85}main{max-width:1100px;margin:auto;padding:20px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d8c5b8;border-radius:11px;padding:11px 14px;background:white;color:#653b42;font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b77b84}button.primary{background:#783748;color:white;border-color:#783748}button:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:white;border:1px solid #e9dcd0;padding:16px;border-radius:16px}.toolbar label{display:grid;gap:6px;font-size:13px;color:#665751}.toolbar input,.toolbar select{padding:10px;border:1px solid #d9c9bd;border-radius:9px;background:#fff;min-height:43px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:white;border:1px solid #eaded2;padding:14px;border-radius:14px}.stat b{display:block;font-size:25px;color:#783748}.stat span{font-size:13px;color:#74635b}.orders{display:grid;gap:13px}.order{background:white;border:1px solid #e6d8ca;border-radius:16px;padding:17px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{font-size:12px;background:#f3e9d9;border-radius:99px;padding:6px 10px}.meta{color:#73635c;font-size:13px;margin:7px 0 14px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.field{background:#faf6f0;border-radius:11px;padding:11px;min-width:0}.field label{display:block;font-size:12px;color:#76665e;margin-bottom:6px}.value{overflow-wrap:anywhere;min-height:38px}.field button{width:100%;margin-top:9px}.bottom{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #eee1d6}.bottom select{padding:10px;border:1px solid #d9c9bd;border-radius:9px}.empty{text-align:center;padding:35px;color:#74635b}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#45342f;color:white;border-radius:12px;padding:12px 20px;display:none;z-index:5}footer{font-size:12px;color:#75655c;margin:20px 0;line-height:1.7}@media(max-width:700px){.fields{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:21px}.toolbar>*{flex:1 1 140px}header{padding:18px}}
</style></head><body>
<header><div><small>STILL JI · DELIVERY MANAGER</small><h1>紀家烘焙坊｜宅配管理</h1><small>V1.0 · 示範模式（不含真實客戶資料）</small></div><span style="font-size:28px">📦</span></header>
<main><section class="toolbar"><label>出貨日期<input type="date" id="date"></label><label>建單狀態<select id="filter"><option value="all">全部</option><option value="待建單">待建單</option><option value="已建單">已建單</option><option value="已出貨">已出貨</option></select></label><label>搜尋訂單<input id="search" type="search" placeholder="姓名／電話／訂單編號"></label><button id="allDates">查看所有日期</button><button id="reset">重設示範狀態</button></section>
<div class="stats"><div class="stat"><b id="pending">0</b><span>待建單</span></div><div class="stat"><b id="built">0</b><span>已建單</span></div><div class="stat"><b id="shipped">0</b><span>已出貨</span></div></div><div id="orders" class="orders"></div>
<footer>安全提醒：這是公開的介面展示頁，只包含虛構訂單。狀態僅保存在目前瀏覽器，不會寫入正式訂單。未完成管理員登入與後端權限驗證前，請勿輸入真實客戶個資。</footer></main><div id="toast" role="status" aria-live="polite"></div>
<script>
const sample=[
{id:"DEMO-1001",name:"王小美",phone:"0912345678",address:"彰化縣彰化市中山路一段100號",date:"2026-11-09",product:"蛋黃酥 12入 × 2盒",status:"待建單"},
{id:"DEMO-1002",name:"林先生",phone:"0922333444",address:"台中市西區公益路100號",date:"2026-11-09",product:"老婆餅 12入 × 3盒",status:"待建單"},
{id:"DEMO-1003",name:"陳小姐",phone:"0933555666",address:"台北市中山區南京東路一段10號",date:"2026-11-10",product:"土鳳梨酥 12入 × 1盒",status:"已建單"},
{id:"DEMO-1004",name:"張先生",phone:"0955777888",address:"桃園市桃園區中正路200號",date:"2026-11-10",product:"蛋黃酥 6入 × 4盒",status:"待建單"}
];const key="stillji_delivery_demo_v1";let states={};try{states=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){};let all=true;const el=id=>document.getElementById(id);function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(t){el("toast").textContent=t;el("toast").style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>el("toast").style.display="none",2000)}async function copy(v){try{await navigator.clipboard.writeText(v);toast("已複製，可切換到黑貓 App 貼上")}catch(e){const t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("已複製")}catch(e){toast("無法複製，請長按選取文字")}t.remove()}}function render(){const list=sample.filter(o=>(all||o.date===el("date").value)&&(el("filter").value==="all"||(states[o.id]||o.status)===el("filter").value)&&[o.name,o.phone,o.id,o.product].some(v=>v.toLowerCase().includes(el("search").value.trim().toLowerCase())));for(const [id,status] of [["pending","待建單"],["built","已建單"],["shipped","已出貨"]])el(id).textContent=sample.filter(o=>(all||o.date===el("date").value)&&(states[o.id]||o.status)===status).length;el("orders").innerHTML=list.length?list.map(o=>{const status=states[o.id]||o.status;return '<article class="order"><div class="top"><div><strong>'+esc(o.name)+'</strong>　<small>'+esc(o.id)+'</small></div><span class="tag">'+esc(status)+'</span></div><div class="meta">📅 '+esc(o.date)+' 出貨　·　'+esc(o.product)+'</div><div class="fields">'+[['姓名',o.name],['手機',o.phone],['地址',o.address]].map(([label,value])=>'<div class="field"><label>'+label+'</label><div class="value">'+esc(value)+'</div><button data-copy="'+esc(value)+'">複製'+label+'</button></div>').join('')+'</div><div class="bottom"><button class="primary" data-all="'+esc(o.id)+'">複製整筆收件資料</button><label>建單狀態 <select data-status="'+esc(o.id)+'">'+['待建單','已建單','已出貨'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div></article>'}).join(''):'<div class="empty">目前沒有符合條件的示範訂單</div>'}el("orders").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-copy"))copy(b.getAttribute("data-copy"));if(b.hasAttribute("data-all")){const o=sample.find(x=>x.id===b.getAttribute("data-all"));if(o)copy("收件人："+o.name+"\n手機："+o.phone+"\n地址："+o.address+"\n商品："+o.product+"\n出貨日："+o.date)}});el("orders").addEventListener("change",e=>{if(e.target.matches("[data-status]")){states[e.target.dataset.status]=e.target.value;try{localStorage.setItem(key,JSON.stringify(states))}catch(e){}render()}});["date","filter","search"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",()=>{if(id==="date")all=false;render()}));el("allDates").onclick=()=>{all=true;el("date").value="";render()};el("reset").onclick=()=>{states={};try{localStorage.removeItem(key)}catch(e){}render();toast("示範狀態已重設")};render();
</script></body></html>
