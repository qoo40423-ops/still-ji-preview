<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b3445"><title>紀家｜宅配管理介面示範</title><style>body{margin:0;background:#f8f4ec;color:#49352b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:740px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#7b3445;font-size:26px;margin:8px 0}small,.muted{color:#8a776b}article{background:white;border:1px solid #e7d8c9;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #49352b0b}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee4d9}.row:last-child{border:0}.value{overflow-wrap:anywhere;font-weight:650}button{background:#7b3445;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:15px;min-width:84px}button:focus-visible{outline:3px solid #e6aa5b}button.secondary{background:#f0e6db;color:#6a4050}button:disabled{opacity:.55}nav{display:flex;gap:8px;margin-top:22px}nav button{flex:1}.tag{background:#f7ebdb;padding:5px 10px;border-radius:20px;font-size:13px;color:#885c21}#notice{min-height:24px;color:#286747}p{line-height:1.7}</style></head><body><main><header><div><small>STILL JI · INTERNAL DEMO</small><h1>宅配訂單管理</h1></div><span class="tag">示範版</span></header><p class="muted">僅使用虛構資料。尚未連接 Google 試算表，請勿用於正式出貨。</p><nav><button id="pendingTab" onclick="show('pending')">待建單</button><button class="secondary" id="doneTab" onclick="show('done')">已建單</button></nav><div style="margin-top:18px"><label for="search">搜尋收件人姓名</label><input id="search" placeholder="輸入姓名或部分姓名" oninput="render()" style="display:block;box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border:1px solid #d6c7b8;border-radius:10px;font-size:16px"></div><section id="list"></section><p id="notice" role="status" aria-live="polite"></p></main><script>const sample=[{id:'DEMO-001',name:'王小美',phone:'0912345678',address:'彰化縣彰化市中山路一段100號',product:'蛋黃酥 12入 × 2盒',date:'2026-11-09',invoice:'否',remit:'',verified:'',paid:false,done:false},{id:'DEMO-002',name:'林小明',phone:'0987654321',address:'臺中市西區公益路100號',product:'老婆餅 12入 × 1盒',date:'2026-11-10',invoice:'是｜統編 12345675（示範）',remit:'12345',verified:'2026-11-08',paid:true,done:false}];let filter='pending';function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}function show(f){filter=f;document.getElementById('pendingTab').className=f==='pending'?'':'secondary';document.getElementById('doneTab').className=f==='done'?'':'secondary';render()}function render(){const list=document.getElementById('list');list.innerHTML='';sample.filter(x=>x.done===(filter==='done')&&x.name.includes(document.getElementById('search').value.trim())).forEach(o=>{const card=document.createElement('article');card.innerHTML='<small>'+esc(o.id)+'</small><h2>'+esc(o.product)+'</h2><p>出貨日：'+esc(o.date)+'</p>'+[['姓名',o.name],['手機',o.phone],['地址',o.address]].map(([label,value],i)=>'<div class="row"><div><small>'+label+'</small><div class="value">'+esc(value)+'</div></div><button data-copy="'+i+'">複製</button></div>').join('')+'<p><button class="secondary" data-toggle="1">'+(o.done?'改回待建單':'✓ 已建立黑貓託運單')+'</button></p>';card.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{const v=[o.name,o.phone,o.address][Number(btn.dataset.copy)];try{await navigator.clipboard.writeText(v);document.getElementById('notice').textContent='已複製 '+['姓名','手機','地址'][Number(btn.dataset.copy)]}catch(e){document.getElementById('notice').textContent='無法自動複製，請長按文字選取複製'}}));card.querySelector('[data-toggle]').addEventListener('click',()=>{o.done=!o.done;document.getElementById('notice').textContent='示範狀態已切換（不會儲存或修改真實訂單）';render()});list.appendChild(card)});if(!list.children.length)list.innerHTML='<article><p>目前沒有'+(filter==='done'?'已建單':'待建單')+'的示範訂單。</p></article>'}render()</script></body></html>
