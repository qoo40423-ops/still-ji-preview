<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b3445"><title>紀家｜宅配管理示範</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f4ec;color:#49352b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:760px;margin:auto;padding:16px 14px 40px}h1{color:#7b3445;margin:5px 0 12px}h2{font-size:18px;margin:8px 0}small,.muted{color:#8a776b}article{background:white;border:1px solid #e7d8c9;border-radius:18px;padding:14px 18px;margin-top:12px;box-shadow:0 4px 20px #49352b0b}.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee4d9}.value{overflow-wrap:anywhere;font-weight:650}button{background:#7b3445;color:white;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;min-width:68px}button.secondary{background:#f0e6db;color:#6a4050}button:focus-visible,input:focus-visible{outline:3px solid #e6aa5b}nav{display:flex;gap:8px;margin:20px 0}nav button{flex:1}input{border:1px solid #d6c7b8;border-radius:10px;padding:9px 11px;font-size:16px;max-width:100%;width:100%;margin-top:6px}label{display:block;font-size:14px;color:#68574e}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.field{min-width:0}.tag{display:inline-block;background:#f7ebdb;padding:5px 10px;border-radius:20px;font-size:13px;color:#885c21}.notice{min-height:22px;color:#286747}p{line-height:1.45;margin:8px 0}@media(max-width:460px){.fields{grid-template-columns:1fr}}
</style></head><body><main><small>STILL JI · INTERNAL DEMO</small><h1>宅配訂單管理 <span class="tag">示範版</span></h1><p class="muted">僅使用虛構資料；目前不連接 Google 試算表，輸入的內容只在此頁面暫存，重新整理即還原。</p>
<label for="search">搜尋收件人姓名</label><input id="search" placeholder="輸入姓名或部分姓名" autocomplete="off">
<nav><button id="pendingTab">待建單</button><button id="doneTab" class="secondary">已建單</button></nav><section id="list"></section><p id="notice" class="notice" role="status" aria-live="polite"></p></main>
<script>
const orders=[{id:'DEMO-001',name:'王小美',phone:'0912345678',address:'彰化縣彰化市中山路一段100號',product:'蛋黃酥 12入 × 2盒',ship:'2026-11-09',invoice:'否',tracking:'',last5:'',paidDate:'',done:false},{id:'DEMO-002',name:'林小明',phone:'0987654321',address:'臺中市西區公益路100號',product:'老婆餅 12入 × 1盒',ship:'2026-11-10',invoice:'是｜統編 12345675（示範）',tracking:'',last5:'12345',paidDate:'2026-11-08',done:false}];
let tab='pending';const $=id=>document.getElementById(id);
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function message(s){$('notice').textContent=s}
function setTab(t){tab=t;$('pendingTab').className=t==='pending'?'':'secondary';$('doneTab').className=t==='done'?'':'secondary';render()}
$('pendingTab').onclick=()=>setTab('pending');$('doneTab').onclick=()=>setTab('done');$('search').oninput=render;
function render(){
 const list=$('list');list.replaceChildren();const q=$('search').value.trim();
 const matching=orders.filter(o=>o.done===(tab==='done')&&o.name.includes(q));
 for(const o of matching){
  const card=el('article');card.append(el('small','',o.id),el('h2','',o.product),el('p','', '希望出貨日：'+o.ship),el('p','','是否需要統編：'+o.invoice));
  for(const [label,value] of [['收件人姓名',o.name],['手機',o.phone],['地址',o.address]]){
   const row=el('div','row'),info=el('div'),copy=el('button','','複製');
   info.append(el('small','',label),el('div','value',value));
   copy.onclick=async()=>{try{await navigator.clipboard.writeText(value);message('已複製'+label)}catch{message('無法自動複製，請長按文字手動複製')}};row.append(info,copy);card.append(row)
  }
  const trackingWrap=el('div','field'),trackingLabel=el('label','','黑貓快遞單號'),trackingInput=el('input');trackingInput.type='text';trackingInput.value=o.tracking;trackingInput.placeholder='輸入託運單號';trackingInput.autocomplete='off';trackingInput.addEventListener('input',()=>{o.tracking=trackingInput.value.trim()});trackingWrap.append(trackingLabel,trackingInput);card.append(trackingWrap);const fields=el('div','fields');
  for(const [key,label,type] of [['last5','匯款後五碼','text'],['paidDate','客人實際匯款日期','date']]){
   const wrap=el('div','field'),lab=el('label','',label),inp=el('input');
   inp.type=type;inp.value=o[key];inp.id=o.id+'-'+key;lab.htmlFor=inp.id;
   if(key==='last5'){inp.inputMode='numeric';inp.maxLength=5;inp.placeholder='例如 12345';inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,5);o.last5=inp.value})}
   else inp.addEventListener('change',()=>{o.paidDate=inp.value});
   wrap.append(lab,inp);fields.append(wrap)
  }
  card.append(fields,el('p','muted',o.paidDate?'匯款狀態：已匯款（依填寫日期顯示）':'匯款狀態：未填寫'));
  const done=el('button','secondary',o.done?'改回待建單':'✓ 已建立黑貓託運單');
  done.onclick=()=>{o.done=!o.done;message('已切換示範狀態，不會修改正式訂單');render()};
  card.append(done);list.append(card)
 }
 if(!matching.length)list.append(el('article','','目前沒有符合的示範訂單。'))
}
render();
</script></body></html>
