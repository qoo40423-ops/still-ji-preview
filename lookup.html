<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂單查詢｜紀家烘焙坊 STILL JI</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f2e9;color:#49352b;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;padding:24px 16px}main{max-width:560px;margin:48px auto;background:#fffdf9;border:1px solid #e9dfd1;border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 12px 36px #49352b0c}h1{font-family:serif;letter-spacing:.12em;margin:8px 0 10px}.eyebrow{font-size:12px;color:#8a7b6d;letter-spacing:.18em}.muted{color:#70584a;font-size:14px;line-height:1.8}label{display:block;margin:20px 0 8px;font-weight:700;font-size:14px}input{width:100%;padding:13px;border:1px solid #d9cbb9;border-radius:10px;font-size:16px;background:white}button,.action{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;margin-top:20px;background:#7e2733;color:white}.action.secondary{background:#fff;color:#49352b;border:1px solid #b79a68}section{margin-top:30px;border-top:1px solid #e9dfd1;padding-top:22px}#result{margin-top:16px;line-height:1.8;font-size:14px}a{color:#7e2733}.fine{font-size:12px;color:#8a7b6d}</style></head><body><main><a href="index.html">← 返回 STILL JI 首頁</a><p class="eyebrow">STILL JI · 紀家烘焙坊</p><h1>訂單查詢</h1><p class="muted">輸入訂單編號與訂購時的手機號碼，即可查看訂購商品與總金額。</p><form id="lookupForm"><label for="orderId">訂單編號</label><input id="orderId" required autocomplete="off" placeholder="ORD 開頭的訂單編號" maxlength="43"><label for="phone">訂購人手機號碼</label><input id="phone" required type="tel" inputmode="numeric" autocomplete="tel" placeholder="09XXXXXXXX" maxlength="10" pattern="09[0-9]{8}"><button type="submit" id="submit">查詢訂單</button></form><div id="result" role="status" aria-live="polite"></div><p class="fine">TEST 測試頁｜商品與總金額依訂單紀錄顯示；付款狀態及配送進度尚未開放查詢。</p><section><h2>忘記訂單編號？</h2><p class="muted">請透過官方 LINE 聯繫客服，核對訂購資料後協助查詢。為保護個資，無法僅憑手機號碼公開訂單。</p><a class="action secondary" href="https://lin.ee/ifHbhYi" target="_blank" rel="noopener noreferrer">聯繫官方 LINE 客服</a></section></main><script>
const API_URL = "https://script.google.com/macros/s/AKfycbwhNqUPzuBem_Hw01eCnDHhQEKVB2QQ7qHX4HZVvKIi4j1LMpY9WdhaIXnqZjo2Oo8m/exec";
document.getElementById('lookupForm').addEventListener('submit', function(e) {
 e.preventDefault();
 const id=document.getElementById('orderId').value.trim(), phone=document.getElementById('phone').value.trim(), result=document.getElementById('result'), btn=document.getElementById('submit');
 if(!/^ORD[A-Za-z0-9_-]{5,40}$/.test(id)||!/^09\d{8}$/.test(phone)){result.textContent='請檢查訂單編號與手機格式。';return;}
 result.textContent='查詢中…';btn.disabled=true;
 const cb='stillJiLookup_'+Date.now()+'_'+Math.floor(Math.random()*100000), script=document.createElement('script');
 let finished=false;
 const timer=setTimeout(()=>finish(null),12000);
 function finish(data){if(finished)return;finished=true;clearTimeout(timer);delete window[cb];script.remove();btn.disabled=false;
 if(!data){result.textContent='查詢逾時，請稍後再試或聯繫官方 LINE。';return;}
 if(data.status==='ok'&&data.found===true){
   const order=data.order||{}, items=Array.isArray(data.items)?data.items:[];
   result.replaceChildren();
   const heading=document.createElement('h2');heading.textContent='✅ 您的訂單明細';result.appendChild(heading);
   const add=(label,value)=>{const row=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+'：';row.append(strong,document.createTextNode(String(value||'—')));result.appendChild(row);};
   add('訂單編號',order.orderId);add('訂購方式',order.mode);add('預訂日期',order.date);if(order.timeSlot)add('預訂時段',order.timeSlot);
   const title=document.createElement('h3');title.textContent='訂購商品';result.appendChild(title);
   if(items.length){
     const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse';
     const head=document.createElement('tr');['商品／規格','盒數','小計'].forEach(t=>{const th=document.createElement('th');th.textContent=t;th.style.cssText='padding:8px 4px;text-align:left;border-bottom:1px solid #ddd';head.appendChild(th)});table.appendChild(head);
     items.forEach(item=>{const tr=document.createElement('tr');[item.product+' '+item.spec,item.quantity+' 盒','NT$ '+item.subtotal].forEach(t=>{const td=document.createElement('td');td.textContent=t;td.style.cssText='padding:9px 4px;border-bottom:1px solid #eee';tr.appendChild(td)});table.appendChild(tr)});result.appendChild(table);
   } else {const note=document.createElement('p');note.textContent='這筆訂單尚無可顯示的商品明細，請聯繫客服確認。';result.appendChild(note)}
   add('訂單總金額','NT$ '+order.total);
 }
 else if(data.status==='ok'&&data.found===false){result.textContent='找不到符合的訂單，請檢查編號與手機號碼，或聯繫客服。';}
 else{result.textContent='目前無法完成查詢，請稍後再試或聯繫客服。';}
 }
 window[cb]=finish;script.onerror=()=>finish(null);
 script.src=API_URL+'?orderId='+encodeURIComponent(id)+'&phone='+encodeURIComponent(phone)+'&callback='+encodeURIComponent(cb);
 document.body.appendChild(script);
});
</script></body></html>
