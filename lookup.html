</style></head><body><main><a href="index.html">返回首頁</a><p class="eyebrow">STILL JI · 紀家烘焙坊</p><h1>訂單查詢</h1><p class="muted">輸入訂單編號與訂購時的手機號碼，即可查看訂購商品、訂單狀態與已核定金額。</p><form id="lookupForm"><label for="orderId">訂單編號</label><input id="orderId" required autocomplete="off" placeholder="ORD 開頭的訂單編號" maxlength="43"><label for="phone">訂購人手機號碼</label><input id="phone" required type="tel" inputmode="numeric" autocomplete="tel" placeholder="09XXXXXXXX" maxlength="10" pattern="09[0-9]{8}"><button type="submit" id="submit">查詢訂單</button></form><div id="result" role="status" aria-live="polite"></div><p class="fine">TEST 測試頁｜商品與總金額依訂單紀錄顯示；付款狀態及配送進度尚未開放查詢。</p><section><h2>忘記訂單編號？</h2><p class="muted">請透過官方 LINE 聯繫客服，核對訂購資料後協助查詢。為保護個資，無法僅憑手機號碼公開訂單。</p><a class="action secondary" href="https://lin.ee/ifHbhYi" target="_blank" rel="noopener noreferrer">聯繫官方 LINE 客服</a></section></main><script>
const API_URL = "https://script.google.com/macros/s/AKfycbwIquhWaDINXw83wUJAYo8dOgcEMFZqPzpWZZkO_02vAd4EmPj9Ysc9sNe9g83jSmbuuw/exec"; // 請填入新 TEST 整合版部署網址
document.getElementById('lookupForm').addEventListener('submit', function(e) {
 e.preventDefault();
 const id=document.getElementById('orderId').value.trim(), phone=document.getElementById('phone').value.trim(), result=document.getElementById('result'), btn=document.getElementById('submit');
 if(!/^ORD[A-Za-z0-9_-]{5,40}$/.test(id)||!/^09\d{8}$/.test(phone)){result.textContent='請檢查訂單編號與手機格式。';return;}
 result.textContent='查詢中…';btn.disabled=true;
 const cb='stillJiLookup_'+Date.now()+'_'+Math.floor(Math.random()*100000), script=document.createElement('script');
 let finished=false;
 const timer=setTimeout(()=>finish(null),12000);
 function finish(data){if(finished)return;finished=true;clearTimeout(timer);delete window[cb];script.remove();btn.disabled=false;
 if(!data){result.textContent='查詢逾時，請稍後再試或聯繫官方 LINE。';return;}
 if(data.status==='ok'&&data.found===true){
   const order=data.order||{}, items=Array.isArray(data.items)?data.items:[];
   result.replaceChildren();
   const heading=document.createElement('h2');heading.textContent='✅ 您的訂單明細';result.appendChild(heading);
   const add=(label,value)=>{const row=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+'：';row.append(strong,document.createTextNode(String(value||'—')));result.appendChild(row);};
   add('訂單編號',order.orderId);add('訂購方式',order.mode);add('預訂日期',order.date);if(order.timeSlot)add('預訂時段',order.timeSlot);
   const title=document.createElement('h3');title.textContent='訂購商品';result.appendChild(title);
   if(items.length){
     const table=document.createElement('table');table.style.cssText='width:100%;border-collapse:collapse';
     const head=document.createElement('tr');['商品／規格','盒數','小計'].forEach(t=>{const th=document.createElement('th');th.textContent=t;th.style.cssText='padding:8px 4px;text-align:left;border-bottom:1px solid #ddd';head.appendChild(th)});table.appendChild(head);
     items.forEach(item=>{const tr=document.createElement('tr');[item.product+' '+item.spec,item.quantity+' 盒','NT$ '+item.subtotal].forEach(t=>{const td=document.createElement('td');td.textContent=t;td.style.cssText='padding:9px 4px;border-bottom:1px solid #eee';tr.appendChild(td)});table.appendChild(tr)});result.appendChild(table);
   } else {const note=document.createElement('p');note.textContent='這筆訂單尚無可顯示的商品明細，請聯繫客服確認。';result.appendChild(note)}
   const labels={PENDING_REVIEW:'待人工確認（尚未成立，請勿轉帳）',CONFIRMED:'訂單已成立',CANCELLED:'已取消',REJECTED:'未受理'};
   add('訂單狀態',labels[order.orderStatus]||order.orderStatus||'待人工確認');
   add('正式應付金額',order.orderStatus==='CONFIRMED'&&order.total!==null&&order.total!==''?'NT$ '+order.total:'尚未核定，請勿轉帳');
   if(order.mode==='宅配到府' && order.trackingNumber){add('黑貓快遞單號',order.trackingNumber);const a=document.createElement('a');a.href='https://www.t-cat.com.tw/inquire/trace.aspx';a.target='_blank';a.rel='noopener noreferrer';a.textContent='前往黑貓貨況查詢';result.appendChild(a);} 
 }
 else if(data.status==='ok'&&data.found===false){result.textContent='找不到符合的訂單，請檢查編號與手機號碼，或聯繫客服。';}
 else{result.textContent='目前無法完成查詢，請稍後再試或聯繫客服。';}
 }
 window[cb]=finish;script.onerror=()=>finish(null);
 script.src=API_URL+'?orderId='+encodeURIComponent(id)+'&phone='+encodeURIComponent(phone)+'&callback='+encodeURIComponent(cb);
 document.body.appendChild(script);
});
</script></body></html>
